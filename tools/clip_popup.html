<!-- clip popup: tap a face-up clip card's video to open it big with sound (shared by index.html and archive.html) -->
<style>
.flip[aria-pressed="true"] .art.clip{cursor:zoom-in}
.flip[aria-pressed="true"] .art.clip::after{content:"⤢ Tap to watch";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:3;font-family:"DM Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(10,15,38,.72);border:1px solid rgba(124,243,255,.45);border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none;box-shadow:0 0 10px rgba(124,243,255,.35)}
.cz-pop{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:radial-gradient(60% 50% at 50% 40%,rgba(43,63,128,.27),rgba(5,8,20,.46));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .2s}
.cz-pop.on{opacity:1}
.cz-pop[hidden]{display:none}
.cz-pop-box{position:relative;display:grid;grid-template-columns:auto;gap:12px;justify-items:center;max-width:min(96vw,560px);transform:scale(.94);transition:transform .25s cubic-bezier(.2,.7,.1,1)}
.cz-pop.on .cz-pop-box{transform:none}
.cz-pop video{display:block;height:min(72vh,calc((96vw) * 16 / 9));max-height:72vh;aspect-ratio:9/16;max-width:96vw;border-radius:16px;background:#000;
  box-shadow:0 0 0 2px rgba(124,243,255,.55),0 0 34px rgba(124,243,255,.35),0 30px 70px rgba(0,0,0,.65),0 0 0 9999px rgba(0,0,0,0)}
.cz-pop-meta{position:relative;overflow:hidden;text-align:center;color:#e8ecf8;max-width:52ch;display:grid;gap:4px;padding:10px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 48%,rgba(255,255,255,.02) 52%,rgba(255,255,255,.07) 100%),rgba(20,28,64,.38);
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -10px 20px rgba(124,243,255,.06),0 12px 32px rgba(0,0,0,.35)}
.cz-pop-meta::before{content:"";position:absolute;inset:0 0 auto 0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));border-radius:14px 14px 50% 50%/14px 14px 18px 18px;pointer-events:none}
.cz-pop-meta::after{content:"";position:absolute;top:-40%;left:-30%;width:40%;height:180%;transform:rotate(20deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.12),rgba(255,255,255,0));pointer-events:none}
.cz-pop-meta>*{position:relative}
.cz-pop-meta h3{margin:0;font-family:"Oxanium","Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:clamp(18px,2.4vw,24px);color:#fff}
.cz-pop-meta .m{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7cf3ff}
.cz-pop-meta p{margin:0;font-size:14px;line-height:1.45;color:#c9cfe4}
.cz-pop-row{display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;align-items:center}
.cz-pop-row .holo-btn{font-size:9px;padding:10px 14px}
.cz-pop-x,.cz-pop-nav{position:fixed;z-index:2;border:0;cursor:pointer;color:#fff;background:rgba(10,15,38,.7);border:1px solid rgba(255,255,255,.25);border-radius:50%;width:44px;height:44px;font-size:20px;line-height:1;display:grid;place-items:center}
.cz-pop-x{top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
.cz-pop-row .cz-pop-nav{position:static;flex:0 0 auto;width:40px;height:40px;font-size:22px}
.cz-pop-nav[hidden]{display:none}
.cz-pop-x:hover,.cz-pop-nav:hover{border-color:#ffd23f;color:#ffd23f}
.cz-pop-x:focus-visible,.cz-pop-nav:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (max-width:560px){.cz-pop-row{gap:6px}.cz-pop-row .holo-btn{font-size:8px;padding:9px 9px}.cz-pop-row .cz-pop-nav{width:34px;height:34px;font-size:19px}.cz-pop video{height:auto;width:92vw;max-height:70vh}.cz-pop-meta p{font-size:13px}}
@media (prefers-reduced-motion:reduce){.cz-pop,.cz-pop-box{transition:none}}
.cz-pop-vwrap{position:relative;line-height:0}
.cz-pop video{cursor:pointer}
.cz-pop-snd{position:absolute;right:10px;bottom:10px;z-index:2;font-family:"DM Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1;color:#fff;background:rgba(10,15,38,.6);border:1px solid rgba(124,243,255,.5);border-radius:999px;padding:7px 11px;cursor:pointer}
.cz-pop-snd[aria-pressed="false"]{color:#ffd23f;border-color:rgba(255,210,63,.6)}
.cz-pop-paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;display:none;place-items:center;font-size:26px;line-height:1;color:#fff;background:rgba(10,15,38,.55);pointer-events:none}
.cz-pop.paused .cz-pop-paused{display:grid}
.cz-pop-bar{position:absolute;left:0;right:0;bottom:0;height:16px;z-index:2;cursor:pointer;display:flex;align-items:flex-end}
.cz-pop-bar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18);border-radius:0 0 16px 16px}
.cz-pop-bar i{position:relative;display:block;height:4px;width:0;background:linear-gradient(90deg,#7cf3ff,#ffd23f);border-radius:0 0 0 16px;box-shadow:0 0 8px rgba(124,243,255,.7)}
.cz-pop-snd{bottom:14px}
</style>
<script>
(function(){
  let pop,vid,snd,ttl,meta,blurb,list=[],idx=0,lastFocus=null;
  const clips=()=>[...document.querySelectorAll('.flip')].filter(c=>c.querySelector('.art.clip video')&&!(c.closest('.pocket')||{}).hidden);
  function build(){if(pop)return;
    pop=document.createElement('div');pop.className='cz-pop';pop.hidden=true;pop.setAttribute('role','dialog');pop.setAttribute('aria-modal','true');pop.setAttribute('aria-label','Clip player');
    pop.innerHTML='<button class="cz-pop-x" type="button" aria-label="Close">✕</button>'+
      '<div class="cz-pop-box"><div class="cz-pop-vwrap"><video playsinline loop preload="auto"></video><button class="cz-pop-snd" type="button" aria-pressed="true">Sound on</button><span class="cz-pop-paused" aria-hidden="true">▶</span><div class="cz-pop-bar" aria-hidden="true"><i></i></div></div><div class="cz-pop-meta"><span class="m"></span><h3></h3><p></p></div>'+
      '<div class="cz-pop-row"><button class="cz-pop-nav prev" type="button" aria-label="Previous clip">‹</button><a class="holo-btn" href="https://www.instagram.com/1cardz_news/" target="_blank" rel="noopener">Instagram</a><a class="holo-btn" href="https://www.youtube.com/@1Cardzcom" target="_blank" rel="noopener">YouTube</a><a class="holo-btn" href="https://www.tiktok.com/@1cardz.com" target="_blank" rel="noopener">TikTok</a><button class="cz-pop-nav next" type="button" aria-label="Next clip">›</button></div></div>';
    document.body.append(pop);vid=pop.querySelector('video');snd=pop.querySelector('.cz-pop-snd');
    const setSnd=()=>{const on=!vid.muted;snd.textContent=on?'Sound on':'Sound off';snd.setAttribute('aria-pressed',String(on));snd.setAttribute('aria-label',on?'Turn sound off':'Turn sound on')};
    snd.addEventListener('click',e=>{e.stopPropagation();vid.muted=!vid.muted;if(vid.paused)vid.play().catch(()=>{});setSnd()});
    vid.addEventListener('click',()=>{if(vid.paused)vid.play().catch(()=>{});else vid.pause()});
    vid.addEventListener('play',()=>pop.classList.remove('paused'));vid.addEventListener('pause',()=>pop.classList.add('paused'));vid.addEventListener('volumechange',setSnd);
    const bar=pop.querySelector('.cz-pop-bar i');
    const tick=()=>{const d=vid.duration||0,c=vid.currentTime||0;bar.style.width=(d?Math.min(100,c/d*100):0)+'%'};
    ['timeupdate','loadedmetadata','seeked','emptied'].forEach(ev=>vid.addEventListener(ev,tick));
    (function loop(){if(!pop.hidden&&!vid.paused)tick();requestAnimationFrame(loop)})();
    pop.querySelector('.cz-pop-bar').addEventListener('click',e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();if(vid.duration)vid.currentTime=(e.clientX-r.left)/r.width*vid.duration});ttl=pop.querySelector('h3');meta=pop.querySelector('.m');blurb=pop.querySelector('.cz-pop-meta p');
    pop.querySelector('.cz-pop-x').addEventListener('click',close);
    pop.querySelector('.prev').addEventListener('click',()=>go(-1));pop.querySelector('.next').addEventListener('click',()=>go(1));
    pop.addEventListener('click',e=>{if(e.target===pop)close()});
    addEventListener('keydown',e=>{if(pop.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
    let sx=null;pop.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
    pop.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60)go(dx<0?1:-1)},{passive:true});
  }
  function show(card){const v=card.querySelector('.art.clip video');
    vid.poster=v.dataset.poster||'';vid.src=v.dataset.full||v.getAttribute('src');vid.muted=false;vid.currentTime=0;
    ttl.textContent=(card.querySelector('h3')||{}).textContent||'';
    meta.textContent=((card.querySelector('.typeline span')||{}).textContent||'').trim();
    blurb.textContent=((card.querySelector('.txt p')||{}).textContent||'').trim();
    const pr=vid.play();if(pr)pr.catch(()=>{vid.muted=true;vid.play().catch(()=>{})});
    pop.querySelectorAll('.cz-pop-nav').forEach(b=>b.hidden=list.length<2)}
  function open(card){build();list=clips();idx=Math.max(0,list.indexOf(card));lastFocus=document.activeElement;
    document.querySelectorAll('.flip video').forEach(v=>{if(!v.paused)v.pause()});
    pop.hidden=false;requestAnimationFrame(()=>pop.classList.add('on'));document.documentElement.style.overflow='hidden';show(list[idx]);pop.querySelector('.cz-pop-x').focus()}
  function go(d){if(!list.length)return;idx=(idx+d+list.length)%list.length;const c=list[idx];if(c.getAttribute('aria-pressed')!=='true')c.setAttribute('aria-pressed','true');show(c)}
  function close(){if(!pop||pop.hidden)return;vid.pause();vid.removeAttribute('src');vid.load();pop.classList.remove('on');document.documentElement.style.overflow='';
    setTimeout(()=>{pop.hidden=true},200);dispatchEvent(new Event('scroll'));if(lastFocus&&lastFocus.focus)lastFocus.focus()}
  document.addEventListener('click',e=>{const art=e.target.closest('.art.clip');if(!art)return;const card=art.closest('.flip');
    if(!card||card.getAttribute('aria-pressed')!=='true'||!art.querySelector('video'))return;e.preventDefault();e.stopPropagation();open(card)},true);
})();
</script>

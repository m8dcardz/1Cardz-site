<ul class="dets"><li>Netflix and Wizards of the Coast revealed PLANESWALKER, an animated series based on Magic: The Gathering, on November 13, 2026.</li><li>The series premieres on Netflix in 2027.</li><li>The story centers on Chandra, a volatile pyromancer hunted for her gifts, alongside some of the most legendary Planeswalkers.</li><li>Terry Matalas is showrunner, Cindy Appel co-showrunner and Patrick Osborne supervising director.</li><li>Animation is by the studio Digic, with Hasbro Entertainment among the producers.</li></ul><p class="src">Source: Magic: The Gathering (official) · <a href="news-2026-11-14-magic-s-planeswalker-series-comes-to-netflix-in-2027.html">Read the full story ›</a></p><a class="watch" href="archive.html"><img src="img/nl-clip50.jpg" alt="" loading="lazy"><span><b>Watch the report</b>Luna on this story, in the Library. ▶</span></a><div class="folio">4</div></div></template><template class="mzPg"><div class="mz-page mz-photo t-r"><img class="bg" src="img/nl-p-clip50.jpg" alt="" loading="lazy"><div class="shade"></div><div class="mzt"><i class="wrap" style="float:left;shape-outside:polygon(0% 0%,37.4% 0.0%,39.7% 6.5%,45.9% 18.4%,49.6% 30.4%,50.0% 44.0%,48.2% 54.2%,45.4% 61.0%,52.3% 67.8%,62.0% 76.3%,62.0% 88.2%,62.0% 100.0%,62.0% 100.0%,0% 100%)"></i><p class="kick">Cover story · Magic</p><h3>Magic&#x27;s Planeswalker series comes to Netflix in 2027</h3><p class="sum">Netflix revealed PLANESWALKER on November 13, 2026: an animated Magic: The Gathering series centered on Chandra, premiering in 2027.</p> <p class="why"><b>Why it matters</b>Magic&#x27;s first big streaming series puts Chandra and the Planeswalkers in front of a whole new audience.</p><p class="quip">“Finally, a reason to binge-watch that counts as deck research.”<span>Luna</span></p><p class="src">Source: Magic: The Gathering (official) · <a href="news-2026-11-14-magic-s-planeswalker-series-comes-to-netflix-in-2027.html">Read the full story ›</a></p></div><div class="folio">5</div></div></template><template class="mzPg"><div class="mz-page mz-photo t-r"><img class="bg" src="img/nl-p-clip49.jpg" alt="" loading="lazy"><div class="shade"></div><div class="mzt"><i class="wrap" style="float:left;shape-outside:polygon(0% 0%,41.7% 0.0%,45.7% 0.0%,56.7% 12.8%,62.0% 34.0%,62.0% 58.2%,60.8% 76.4%,55.9% 88.5%,62.0% 100.0%,62.0% 100.0%,62.0% 100.0%,62.0% 100.0%,62.0% 100.0%,0% 100%)"></i><p class="kick">Riftbound · Top story</p><h3>Riftbound bans Riven, Dazzling Aurora and more</h3><p class="sum">Riftbound&#x27;s Radiance ban list adds eight cards and two battlefields to Standard and 2v2 Constructed, effective Monday, November 23, 2026.</p><ul class="facts"><li>Eight cards are banned: Riven, Broken Blade; Zhonya&#x27;s Hourglass; Stellacorn Herder; Nocturne, Horrifying; Rhasa the Sunderer; Brynhir Thundersong; Dazzling Aurora; and Baited Hook.</li><li>Two battlefields are banned too: Emperor&#x27;s Dais and Star Spring.</li><li>Riven made up 43% of decks at the European Regional Championship and took 3 of the top 4 spots.</li></ul><p class="why"><b>Why it matters</b>Riven, Kennen and Kai&#x27;Sa decks all lose key cards, so the competitive meta resets before December&#x27;s North America Regional Championship.</p><p class="src">Source: Riftbound (official) · <a href="news-2026-11-14-riftbound-bans-riven-dazzling-aurora-and-more.html">Read the full story ›</a></p></div><div class="folio">6</div></div></template><template class="mzPg"><div class="mz-page mz-story"><div class="run"><span>Magic</span><span>Wizards of the Coast (WPN)</span></div><p class="kick">Magic</p><h3>Magic&#x27;s Star Trek is out; To Boldly Go league starts</h3>
<p class="first">Magic: The Gathering | Star Trek releases November 13, 2026, and the To Boldly Go sealed league runs in stores through January 28, 2027.</p><ul class="dets"><li>To Boldly Go is a Sealed league at WPN stores, running November 13, 2026 to January 28, 2027.</li><li>Players start with six Star Trek Play Boosters and can add more boosters as they rank up.</li><li>Play three games at Starfleet Academy, then explore four quadrants (Alpha, Beta, Gamma and Delta), each with its own rules.</li><li>Every three matches in a quadrant earns a rank pip; reaching Captain earns a league promo card.</li></ul><p class="why"><b>Why it matters</b>It&#x27;s a casual, months-long way to play the new set at your local store, with a promo at the end.</p><div class="pull">“Six boosters, four quadrants, one promotion to Captain. Engage.”<span>Zia</span></div><p class="src">Source: Wizards of the Coast (WPN) · <a href="news-2026-11-13-magic-s-star-trek-is-out-to-boldly-go-league-starts.html">Read the full story ›</a></p><a class="watch" href="archive.html"><img src="img/nl-clip47.jpg" alt="" loading="lazy"><span><b>Watch the report</b>Zia on this story, in the Library. ▶</span></a><div class="folio">7</div></div></template><template class="mzPg"><div class="mz-page mz-story"><div class="run"><span>Flesh and Blood</span><span>Flesh and Blood (official)</span></div><p class="kick">Flesh and Blood</p><h3>Fang wins Flesh and Blood Worlds in Paris</h3>
<p class="first">Nicolas Jamoulle won World Championship: Paris (November 5-8, 2026) on Fang, Dracai of Blades; runner-up Jin Han Toh also played Fang.</p><div class="pull">“Paris had one dragon on top, and another right behind it.”<span>Zia</span></div><p class="src">Source: Flesh and Blood (official) · <a href="news-2026-11-10-fang-wins-flesh-and-blood-worlds-in-paris.html">Read the full story ›</a></p><a class="watch" href="archive.html"><img src="img/nl-clip42.jpg" alt="" loading="lazy"><span><b>Watch the report</b>Zia on this story, in the Library. ▶</span></a><div class="folio">8</div></div></template><template class="mzPg"><div class="mz-page mz-photo t-l"><img class="bg" src="img/nl-p-clip48.jpg" alt="" loading="lazy"><div class="shade"></div><div class="mzt"><i class="wrap" style="float:right;shape-outside:polygon(100% 0%,56.3% 0.0%,52.3% 0.0%,41.4% 11.7%,38.0% 32.6%,38.0% 56.6%,38.0% 74.5%,42.2% 86.5%,38.0% 98.5%,38.0% 100.0%,38.0% 100.0%,38.0% 100.0%,38.0% 100.0%,100% 100%)"></i><p class="kick">Pokémon · Top story</p><h3>Pokémon Day 2027 Collection lands January 29</h3><p class="sum">The Pokémon Day 2027 Collection reaches stores January 29, 2027, with a stamped foil Pikachu promo, three booster packs, a coin and a TCG Live code card.</p><ul class="facts"><li>It includes a specially stamped foil Pikachu promo card.</li><li>Also inside: three Pokémon TCG booster packs and a collectible coin.</li><li>A code card for Pokémon TCG Live comes in the box.</li></ul><p class="why"><b>Why it matters</b>A new stamped Pikachu promo is a yearly collector favourite, and it lands a month before Pokémon Day.</p><p class="src">Source: ICv2 · <a href="news-2026-11-13-pokemon-day-2027-collection-lands-january-29.html">Read the full story ›</a></p></div><div class="folio">9</div></div></template><template class="mzPg"><div class="mz-page mz-briefs"><div class="run"><span>More top stories</span><span>1 of 2</span></div><div class="briefs"><div class="brief"><p class="kick">Fl

<ul class="dets"><li>Mega Evolution—Flowing Fists releases February 6, 2027, as part of the Mega Evolution Series.</li><li>The expansion includes over 110 cards, with artwork inspired by the excitement of a tournament atmosphere.</li><li>Mega Lucario Z ex leads the set, with Mega Absol Z ex, Mega Garchomp Z ex and Mega Glimmora ex also featured.</li><li>ICv2 counts 15 Pokémon and Trainer cards with special illustrations.</li><li>It comes in Elite Trainer Boxes, Build &amp; Battle boxes, 3-booster blisters, booster displays and hanger packs (ICv2).</li></ul><p class="src">Source: Pokémon (official); ICv2 · <a href="news-2026-11-20-pokemon-tcg-s-flowing-fists-revealed-for-feb-6-2027.html">Read the full story ›</a></p><a class="watch" href="archive.html"><img src="img/nl-clip61.jpg" alt="" loading="lazy"><span><b>Watch the report</b>Zia on this story, in the Library. ▶</span></a><div class="folio">4</div></div></template><template class="mzPg"><div class="mz-page mz-photo t-l"><img class="bg" src="img/nl-p-clip61.jpg" alt="" loading="lazy"><div class="shade"></div><div class="mzt"><i class="wrap" style="float:right;shape-outside:polygon(100% 0%,62.4% 0.0%,59.9% 15.2%,53.3% 28.0%,49.3% 40.7%,48.9% 55.3%,50.8% 66.3%,53.8% 73.6%,46.4% 80.9%,38.0% 90.0%,38.0% 100.0%,38.0% 100.0%,38.0% 100.0%,100% 100%)"></i><p class="kick">Cover story · Pokémon</p><h3>Pokémon TCG&#x27;s Flowing Fists revealed for Feb 6, 2027</h3><p class="sum">The Pokémon Company&#x27;s Mega Evolution—Flowing Fists releases February 6, 2027 with over 110 cards, led by Mega Lucario Z ex and Mega Garchomp Z ex.</p> <p class="why"><b>Why it matters</b>It&#x27;s the next English Pokémon TCG expansion, with a new group of Mega Pokémon ex for players and collectors to chase.</p><p class="quip">“Lucario brought both fists and a Z.”<span>Zia</span></p><p class="src">Source: Pokémon (official); ICv2 · <a href="news-2026-11-20-pokemon-tcg-s-flowing-fists-revealed-for-feb-6-2027.html">Read the full story ›</a></p></div><div class="folio">5</div></div></template><template class="mzPg"><div class="mz-page mz-photo t-r"><img class="bg" src="img/nl-p-clip65.jpg" alt="" loading="lazy"><div class="shade"></div><div class="mzt"><i class="wrap" style="float:left;shape-outside:polygon(0% 0%,46.7% 0.0%,51.6% 0.0%,62.0% 0.0%,62.0% 0.4%,62.0% 29.6%,62.0% 51.5%,62.0% 66.1%,62.0% 80.7%,62.0% 99.0%,62.0% 100.0%,62.0% 100.0%,62.0% 100.0%,0% 100%)"></i><p class="kick">Pokémon · Top story</p><h3>Pokémon&#x27;s Aura Seeker hits Japan Nov 27, all cards out</h3><p class="sum">Japan&#x27;s Aura Seeker expansion, starring Mega Lucario Z ex, releases November 27, 2026; all 78 main-set cards are revealed ahead of English Flowing Fists (Feb 6, 2027).</p><ul class="facts"><li>All 78 main-set cards are now revealed; it is Japan&#x27;s seventh Mega Evolution set, starring Mega Lucario Z ex.</li><li>It is the first set with the Z Mega Evolutions from the Mega Dimension DLC: Mega Lucario Z ex, Mega Absol Z ex and Mega Garchomp Z ex, plus Mega Glimmora ex.</li><li>A special art rare of Crasher Wake&#x27;s Fervor is drawn by manga artist Tetsuo Hara.</li></ul><p class="why"><b>Why it matters</b>It&#x27;s the first full look at the cards coming to the English Pokémon TCG in Flowing Fists early next year.</p><p class="src">Source: Pokémon Card Game (official, Japan); PokéBeach · <a href="news-2026-11-22-pokemon-s-aura-seeker-hits-japan-nov-27-all-cards-out.html">Read the full story ›</a></p></div><div class="folio">6</div></div></template><template class="mzPg"><div class="mz-page mz-story"><div class="run"><span>Lorcana</span><span>Disney Lorcana (official)</span></div><p class="kick">Lorcana</p><h3>Disney Lorcana is going digital: every card, crossplay</h3>
<p class="first">Ravensburger&#x27;s first Disney Lorcana digital game dev blog (November 20, 2026) promises every card from every set, mobile and desktop crossplay and ranked play; no release date yet.</p><ul class="dets"><li>The goal is to include every card from every set released: characters, songs, actions and locations.</li><li>It follows the same rules with the same cards as the tabletop game, so decks built digitally can be brought to the table.</li><li>One account works on mobile and desktop with crossplay, plus ranked matchmaking and replayable practice matches for new players.</li><li>There is no release date yet; fans can sign up at the Disney Lorcana site to hear first when testing begins.</li></ul><p class="why"><b>Why it matters</b>Lorcana players will be able to test decks and new cards any time, with skills that carry over to game night.</p><div class="pull">“Finally, a deck you can shuffle on the bus.”<span>Zia</span></div><p class="src">Source: Disney Lorcana (official) · <a href="news-2026-11-21-disney-lorcana-is-going-digital-every-card-crossplay.html">Read the full story ›</a></p><a class="watch" href="archive.html"><img src="img/nl-clip63.jpg" alt="" loading="lazy"><span><b>Watch the report</b>Zia on this story, in the Library. ▶</span></a><div class="folio">7</div></div></template><template class="mzPg"><div class="mz-page mz-story"><div class="run"><span>Magic</span><span>ICv2; Magic: The Gathering (official)</span></div><p class="kick">Magic</p><h3>Magic&#x27;s Nauctis drops Play Boosters for Booster Packs</h3>
<p class="first">Nauctis: The Sunken Realm (February 5, 2027) sells 14-card Booster Packs, 30 per box, instead of Play Boosters, and Collector Boosters drop from 15 cards to 12.</p><ul class="dets"><li>ICv2 reports Wizards has done away with Play Boosters for the set in favour of Booster Packs.</li><li>Each Booster Pack holds 14 cards plus a double-sided token, and a Booster Pack box holds 30 packs.</li><li>Collector Boosters now hold 12 cards instead of 15, with 12 Collector Boosters per box.</li><li>Both box types include a Sunken Treasures box topper, and about 1 in 1,000 Booster Packs and 1 in 300 Collector Boosters is a God Pack.</li></ul><p class="why"><b>Why it matters</b>It changes what every Nauctis pack and box holds, for players drafting the set and collectors opening boxes.</p><div class="pull">“Fewer cards per Collector pack, more room in the binder.”<span>Luna</span></div><p class="src">Source: ICv2; Magic: The Gathering (official) · <a href="news-2026-11-18-magic-s-nauctis-drops-play-boosters-for-booster-packs.html">Read the full story ›</a></p><a class="watch" href="archive.html"><img src="img/nl-clip58.jpg" alt="" loading="lazy"><span><b>Watch the report</b>Luna on this story, in the Library. ▶</span></a><div class="folio">8</div></div></template><template class="mzPg"><div class="mz-page mz-photo t-r"><img class="bg" src="img/nl-p-clip60.jpg" alt="" loading="lazy"><div class="shade"></div><div class="mzt"><i class="wrap" style="float:left;shape-outside:polygon(0% 0%,47.3% 0.0%,50.6% 0.0%,59.3% 0.0%,62.0% 10.3%,62.0% 29.6%,62.0% 44.1%,58.7% 53.8%,62.0% 63.4%,62.0% 75.5%,62.0% 92.4%,62.0% 100.0%,62.0% 100.0%,0% 100%)"></i><p class="kick">Magic · Top story</p><h3>Magic&#x27;s Dune Secret Lair Superdrop lands November 30</h3><p class="sum">Secret Lair x Dune, My Arrakis, My Superdrop, launches November 30, 2026 with eight new-to-Magic Dune legends and a new Shai-Hulud card.</p><ul class="facts"><li>Secret Lair x Dune: Balance of Power has eight new-to-Magic legendary creatures, including Paul Atreides, Ducal Heir, Baron Vladimir Harkonnen and Princess Irulan Corrino.</li><li>Secret Lair x Dune: Deserts of Arrakis adds a new-to-Magic Shai-Hulud card, plus Crysknife, Thumper and Sandworm Incursion versions of existing cards.</li><li>Secret Lair x Dune: Spice is all halo foil, with Water of Life and Atreides and Harkonnen Spice Harvesters.</li></ul><p class="why"><b>Why it matters</b>It&#x27;s Magic&#x27;s biggest Dune crossover, adding brand-new legends that Commander players can build around.</p><p class="src">Source: Magic: The Gathering (official) · <a href="news-2026-11-19-magic-s-dune-secret-lair-superdrop-lands-november-30.html">Read the full story ›</a></p></div><div class="folio">9</div></div></template><template class="mzPg"><div class="mz-page mz-top"><div class="run"><span>Top stories</span><span>1 of 4</span></div><div class="stories"><div class="st"><img src="img/nl-clip53.jpg" alt="" loading="lazy"><span class="g">Magic</span><b>Stefan Schütz wins Magic World Championship 32</b><p>Stefan Schütz won Magic World Championship 32 in Atlanta on November 15, 2026 with Izzet Mission, taking the $100,000 first prize.</p><small>Source: Magic: The Gathering (official) · <a href="news-2026-11-16-stefan-schutz-wins-magic-world-championship-32.html">Read the full story ›</a></small></div><div class="st"><img src="img/nl-clip54.jpg" alt="" loading="lazy"><span class="g">One Piece</span><b>One Piece&#x27;s OP-18 The Dominance of God lands Nov 20</b><p>One Piece Card Game&#x27;s OP-18 The Dominance of God releases in English on November 20, 2026, with six new Leaders and a 4th Anniversary Event running to December 17.</p><small>Source: One Piece Card Game (official) · <a href="news-2026-11-16-one-piece-s-op-18-the-dominance-of-god-lands-nov-20.html">Read the full story ›</a></small></div></div><div class="folio">10</div></div></template><template class="mzPg"><div class="mz-page mz-top"><div class="run"><span>Top stories</span><span>2 of 4</span></div><div class="stories"><div class="st"><img src="img/nl-clip55.jpg" alt="" loading="lazy"><span class="g">Star Wars</span><b>Star Wars: Unlimited&#x27;s Icons 2027 Edition lands Nov 20</b><p>Star Wars: Unlimited&#x27;s Icons 2027 Edition, a mini-set of over 190 cards, releases November 20, 2026, with a Darth Vader and Leia Organa Starter Box.</p><small>Source: Star Wars: Unlimited (official) · <a href="news-2026-11-17-star-wars-unlimited-s-icons-2027-edition-lands-nov-20.html">Read the full story ›</a></small></div><div class="st"><img src="img/nl-clip57.jpg" alt="" loading="lazy"><span class="g">Riftbound</span><b>Riftbound&#x27;s Convergence Fest hits Vegas Dec 11-13</b><p>Riftbound&#x27;s Convergence Fest runs December 11-13, 2026 in Las Vegas, and participating US stores give out an exclusive Ionic Spark battlefield promo December 9-15.</p><small>Source: Riftbound (official) · <a href="news-2026-11-18-riftbound-s-convergence-fest-hits-vegas-dec-11-13.html">Read the full story ›</a></small></div></div><div class="folio">11</div></div></template><template class="mzPg"><div class="mz-page mz-top"><div class="run"><span>Top stories</span><span>3 of 4</span></div><div class="stories"><div class="st"><img src="img/nl-clip62.jpg" alt="" loading="lazy"><span class="g">Lorcana</span><b>Disney Lorcana returns to EPCOT with a Figment glimmer</b><p>Disney Lorcana returns to EPCOT International Festival of the Arts January 15 to March 1, 2027, with a festival-only Figment glimmer and Minnie, Belle and Alice promos.</p><small>Source: Disney Lorcana (official) · <a href="news-2026-11-20-disney-lorcana-returns-to-epcot-with-a-figment-glimmer.html">Read the full story ›</a></small></div><div class="st"><img src="img/nl-clip64.jpg" alt="" loading="lazy"><span class="g">Magic</span><b>Magic&#x27;s Star Trek Commander Party runs Nov 20-26</b><p>Magic: The Gathering | Star Trek Commander Party runs in WPN stores November 20-26, 2026 (again January 1

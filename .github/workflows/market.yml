name: Update Market Watch prices
on:
  schedule:
    - cron: "35 20 * * *"   # daily, after TCGplayer's daily price refresh (~20:00 UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/market.py
      - name: Commit if changed
        run: |
          git config user.name "1cardz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "Market Watch: daily prices" && git push)
